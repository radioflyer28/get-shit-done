version: "1.0"
semgrep_cli_pinned: "1.45.0"
community_ruleset_version: "1.42.0"
update_date: "2026-04-16"
description: >
  Master index of all semgrep rules used across GSD language-specific security pattern files.
  Rules reference semgrep.dev community rulesets with version pins for reproducibility.
  Use pattern-loader.cjs to consume this file at runtime.

# ─── PYTHON RULES ───────────────────────────────────────────────────────────

rules:
  python-eval-injection:
    source: "p/security-audit"
    semgrep_rule_id: "python.lang.security.audit.eval-injection"
    owasp: "A03:2021-Injection"
    cwe: "CWE-94"
    languages: [python]
    confidence: HIGH
    false_positive_rate: 0.05
    custom_rule: false
    description: "eval() or exec() with dynamic string input enables arbitrary code execution"
    example_cve: "https://nvd.nist.gov/vuln/detail/CVE-2021-28957"
    semgrep_version_introduced: "1.30.0"

  python-sql-injection:
    source: "p/security-audit"
    semgrep_rule_id: "python.django.security.audit.raw-sql.raw-sql"
    owasp: "A03:2021-Injection"
    cwe: "CWE-89"
    languages: [python]
    confidence: HIGH
    false_positive_rate: 0.03
    custom_rule: false
    description: "SQL queries constructed via string formatting without parameterization"
    example_cve: "https://nvd.nist.gov/vuln/detail/CVE-2022-40897"
    semgrep_version_introduced: "1.28.0"

  python-command-injection:
    source: "p/security-audit"
    semgrep_rule_id: "python.lang.security.audit.subprocess-shell-true"
    owasp: "A03:2021-Injection"
    cwe: "CWE-78"
    languages: [python]
    confidence: HIGH
    false_positive_rate: 0.07
    custom_rule: false
    description: "subprocess call with shell=True and user-controlled command"
    example_cve: "https://nvd.nist.gov/vuln/detail/CVE-2023-25577"
    semgrep_version_introduced: "1.30.0"

  python-pickle-deserialization:
    source: "p/security-audit"
    semgrep_rule_id: "python.lang.security.audit.pickle.avoid-pickle"
    owasp: "A08:2021-Software-Integrity-Failures"
    cwe: "CWE-502"
    languages: [python]
    confidence: HIGH
    false_positive_rate: 0.02
    custom_rule: false
    description: "pickle.load/loads with user-controlled data enables arbitrary code execution"
    example_cve: "https://nvd.nist.gov/vuln/detail/CVE-2020-28196"
    semgrep_version_introduced: "1.28.0"

  python-yaml-load:
    source: "p/security-audit"
    semgrep_rule_id: "python.lang.security.audit.yaml-load"
    owasp: "A08:2021-Software-Integrity-Failures"
