    false_positive_rate: 0.10
    custom_rule: false
    description: "Use of MD5, SHA1, or DES for cryptographic operations"
    example_cve: "https://nvd.nist.gov/vuln/detail/CVE-2023-32681"
    semgrep_version_introduced: "1.32.0"

  python-hardcoded-secret:
    source: "p/secrets"
